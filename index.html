
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Pattern Planet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Pattern Game</h1>
    <p>Can you make the same pattern?</p>

    <div class="pattern">
      🔴 🔴 🔵 🔴 🔴 🔵
    </div>

    <h2>Your pattern:</h2>

    <div id="answer" class="answer-grid">
      <div class="slot" data-index="0"></div>
      <div class="slot" data-index="1"></div>
      <div class="slot" data-index="2"></div>
      <div class="slot" data-index="3"></div>
      <div class="slot" data-index="4"></div>
      <div class="slot" data-index="5"></div>
    </div>

    <p>Drag the shapes into the empty boxes!</p>

    <div class="shape-tray">
      <div class="shape" data-shape="⭐">⭐</div>
      <div class="shape" data-shape="🌙">🌙</div>
    </div>

    <div class="controls">
      <button onclick="checkAnswer()">Check</button>
      <button onclick="resetGame()">Reset</button>
    </div>

    <p id="result" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
